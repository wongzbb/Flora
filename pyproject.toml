[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flora-lang"
version = "0.1.0"
description = "An independent effect-bounded language for open agent programs and evidence-scoped contracts"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Flora contributors"}]
readme = "README.md"
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "License :: OSI Approved :: Apache Software License"]

[project.scripts]
flora = "flora.interface.cli:main"

[project.optional-dependencies]
general = ["pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "reportlab>=4,<5"]
mcp = ["mcp>=1.30,<2", "jsonschema>=4.23,<5", "httpx[socks]>=0.28,<1"]
browser = ["playwright>=1.50,<2"]
all = ["flora-lang[general,mcp,browser]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flora = ["py.typed"]
"flora.general" = ["static/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["UP042"]  # Preserve the documented str/Enum Verdict API.
